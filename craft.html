<!doctype html>
<!--
	============================================================================
	craft.html — Crafting Bay POC (Step 1: responsive REM shell + themed chrome)
	============================================================================
-->
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Dumper Cars — Crafting Bay</title>
	</head>
	<body>
		<div id="app">
			<div id="grid">
				<section id="loadout" class="panel">
					<div class="phead">
						<span class="phead__ico"><svg viewBox="0 0 24 24"><path d="M2.5 15c0-3 3-4.5 6-4.5h7c3 0 6 1.5 6 4.5v1.6c0 1.2-1 2.1-2.2 2.1H4.7C3.5 18.7 2.5 17.8 2.5 16.6z"/><rect x="8" y="6.2" width="8" height="4" rx="1"/></svg></span>
						<span class="phead__title">Load Out</span>
						<span class="slashes"><i></i><i></i><i></i></span>
					</div>
					<div class="carview">
						<span>3D car view</span>
						<div class="chargebar">Weight: <b id="wt">0</b><br />Max Charge: <b id="charge">100%</b></div>
					</div>
				</section>

				<section id="inventory" class="panel">
					<div class="phead">
						<span class="phead__ico"><svg viewBox="0 0 24 24"><path d="M3 3h18v5H3zM3 9.5h18v5H3zM3 16h18v5H3z"/></svg></span>
						<span class="phead__title">Inventory</span>
						<span class="slashes"><i></i><i></i><i></i></span>
					</div>
					<div class="invscroll"><div id="invgrid" class="invgrid"></div></div>
				</section>

				<section id="slots" class="panel">
					<div class="phead">
						<span class="phead__ico"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5"/><circle cx="9" cy="10" r="1.6" fill="#465b63"/><circle cx="15" cy="10" r="1.6" fill="#465b63"/><rect x="10.2" y="14" width="3.6" height="3" rx="1" fill="#465b63"/></svg></span>
						<span class="phead__title">Slots</span>
						<span class="slashes"><i></i><i></i><i></i></span>
					</div>
					<div id="slotsrow" class="slotsrow"></div>
				</section>

				<section id="crafting" class="panel">
					<div class="phead">
						<span class="phead__ico"><svg viewBox="0 0 24 24"><path d="M15.5 3a5.5 5.5 0 0 0-5 7.7L3.4 17.8a2 2 0 1 0 2.8 2.8l7.1-7.1A5.5 5.5 0 1 0 15.5 3zm0 2a3.5 3.5 0 1 1 0 7 3.5 3.5 0 0 1 0-7z"/></svg></span>
						<span class="phead__title">Crafting</span>
						<span class="slashes"><i></i><i></i><i></i></span>
					</div>
					<div class="craftunit">
						<div id="cgrid" class="cgrid"></div>
						<div class="arrow"><svg viewBox="0 0 120 80" style="color:var(--arrow)"><path d="M12 62 C 34 26, 62 20, 86 31" fill="none" stroke="currentColor" stroke-width="15" stroke-linecap="round"/><path d="M78 6 L114 34 L74 47 Z" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg></div>
						<div class="outwrap"><span class="outlabel">Output:</span><div id="outcol" class="outcol"></div></div>
					</div>
				</section>
			</div>

			<div id="bottombar">
				<button id="debughit" class="debughit" title="debug"></button>
				<span class="spacer"></span>
				<button class="btnbar" id="btn-keys"><svg viewBox="0 0 24 24"><path d="M14 2a6 6 0 0 0-5.7 8L2 16.3V22h5.7l.6-.6V19h2v-2h2l1.4-1.4A6 6 0 1 0 14 2zm2.5 3.5a1.6 1.6 0 1 1 0 3.2 1.6 1.6 0 0 1 0-3.2z"/></svg>Keys</button>
				<button class="btnbar" id="btn-recipes"><svg viewBox="0 0 24 24"><path d="M4 3.5h7v17H4zM13 3.5h7v17h-7z"/></svg>Recipes</button>
				<span class="spacer"></span>
				<button class="btnbar" id="btn-done"><svg viewBox="0 0 24 24"><path d="M4 12l5 5L20 6" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>Done</button>
			</div>
		</div>
		<script type="module" src="/src/craft/main.js"></script>
	</body>
</html>
